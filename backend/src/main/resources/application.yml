spring:
  application:
    name: myportifolio-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/myportifolio}
    username: ${DB_USERNAME:myportifolio}
    password: ${DB_PASSWORD:myportifolio_local_password}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
