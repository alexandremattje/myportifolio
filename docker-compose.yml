services:
  postgres:
    image: postgres:16-alpine
    container_name: myportifolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: myportifolio
      POSTGRES_USER: myportifolio
      POSTGRES_PASSWORD: myportifolio_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myportifolio -d myportifolio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
